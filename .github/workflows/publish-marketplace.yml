name: Publish Extension

env:
  # This controls JavaScript action runtimes; setup-node below controls npm scripts.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*.*.*"
      - "preview-v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current package.json version to VS Code Marketplace
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Failed to read package.json version."
          }

          $ref = "$env:GITHUB_REF"
          $preview = $ref.StartsWith('refs/tags/preview-v') -or $ref.StartsWith('refs/heads/preview/')
          if ($preview -and "${{ inputs.publish }}" -eq 'true') {
            throw "Preview builds cannot publish to VS Code Marketplace."
          }
          $tagPrefix = if ($preview) { 'preview-v' } else { 'v' }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tagPrefix$version" >> $env:GITHUB_OUTPUT
          "preview=$($preview.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "artifact=copilot-scheduler-$version.vsix" >> $env:GITHUB_OUTPUT

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expectedRef = "refs/tags/${{ steps.meta.outputs.tag }}"
          if ("${{ github.ref }}" -ne $expectedRef) {
            throw "Tag '${{ github.ref }}' does not match package.json version '${{ steps.meta.outputs.version }}'. Expected '$expectedRef'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify package-lock registry hygiene
        run: node scripts/verify-package-lock-registry.js

      - name: Audit dependencies
        run: npm audit --registry=https://registry.npmjs.org

      - name: Verify NLS consistency
        run: npm run verify:nls

      - name: Lint
        run: npm run lint

      - name: Compile extension
        run: npm run compile

      - name: Run test suite
        run: npm test

      - name: Package VSIX
        shell: pwsh
        run: |
          npx vsce package --out "${{ steps.meta.outputs.artifact }}"

      - name: Verify VSIX contents
        run: npm run verify:vsix -- "${{ steps.meta.outputs.artifact }}"

      - name: Verify Marketplace eligibility
        if: steps.meta.outputs.preview != 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
        run: node scripts/verify-vsix-contents.js --verify-marketplace "${{ steps.meta.outputs.artifact }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.artifact }}
          if-no-files-found: error

      - name: Ensure marketplace secret is configured
        if: steps.meta.outputs.preview != 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VSCE_PAT)) {
            throw "Repository secret VSCE_PAT is required to publish to VS Code Marketplace."
          }

      - name: Publish to VS Code Marketplace
        if: steps.meta.outputs.preview != 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx vsce publish --packagePath "${{ steps.meta.outputs.artifact }}" -p "$env:VSCE_PAT"

      - name: Create GitHub release with VSIX
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: ${{ steps.meta.outputs.artifact }}
          generate_release_notes: true
          name: ${{ steps.meta.outputs.preview == 'true' && format('Copilot Scheduler {0} Preview', steps.meta.outputs.version) || steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.preview == 'true' && 'GitHub-only Preview; not published to VS Code Marketplace. Install the attached VSIX manually. It uses the stable extension ID and replaces the stable version in that profile, so a separate test profile is recommended. Detailed model options require explicit enable-proposed-api activation and a full VS Code restart; installation alone does not grant permission. Follow the Preview Distribution instructions in the README. Provider-model consent is separate.' || '' }}
          prerelease: ${{ steps.meta.outputs.preview == 'true' }}
          make_latest: ${{ steps.meta.outputs.preview == 'true' && 'false' || 'true' }}
